<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智囊 · Braintrust</title>
  <link rel="stylesheet" href="launch.css">
  <script src="launch.js" defer></script>
</head>
<body>
  <main aria-labelledby="launch-title">
    <p class="eyebrow">BRAINTRUST</p>
    <h1 id="launch-title">智囊</h1>
    <p class="subtitle">好想法，一起想。</p>
    <progress id="launch-progress" max="3" value="0" aria-label="启动进度"></progress>
    <p id="launch-status" role="status" aria-live="polite">正在打开智囊…</p>
    <p id="launch-version"></p>
    <button id="launch-retry" type="button" hidden>重新打开</button>
    <p id="launch-help" hidden>如果仍无法打开，请到 Edge 扩展管理页，找到「智囊」并点击重新加载。</p>
  </main>
</body>
</html>
